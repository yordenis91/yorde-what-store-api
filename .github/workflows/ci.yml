name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Services import the generated client's types, so nothing compiles
      # without this. It reads the schema only — no database connection.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # Entirely against test doubles. No Postgres or Redis needed.
      - name: Unit test
        run: npm test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The postgres service starts with its default bootstrap user (`postgres`)
    # rather than POSTGRES_USER: yws_test, on purpose. An earlier version of
    # this job set POSTGRES_USER: yws_test and then ran
    # `ALTER ROLE yws_test NOSUPERUSER`, which always failed —
    # "permission denied to alter role: the bootstrap user must have the
    # SUPERUSER attribute". Postgres hard-blocks ever revoking SUPERUSER from
    # whichever role initdb designated as bootstrap, specifically so an
    # instance can never end up with zero superusers; no privilege level gets
    # around that. It silently never worked in CI even though a local run
    # against a role created by hand (never having been the bootstrap role)
    # passed fine — the step below creates yws_test as a brand new role
    # instead, which sidesteps the restriction entirely because it was never
    # the bootstrap user to begin with.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create non-superuser test role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE ROLE yws_test LOGIN PASSWORD 'yws_test' NOSUPERUSER;" \
            -c "CREATE DATABASE yws_test OWNER yws_test;"

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://yws_test:yws_test@localhost:5432/yws_test?schema=public

      - name: e2e test
        run: npm run test:e2e
